services:
  db:
    image: postgres:18-alpine
    container_name: school_admission_db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=250"]
    # Database bootstrap credentials live in backend/.env — one file to rotate.
    env_file:
      - ./backend/.env
    volumes:
      - db-data:/var/lib/postgresql
    # Port 5432 is internal within Docker network (uncomment ports to inspect from host)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/SchoolAdmission.sln
    # Backend configuration: database connection, hold duration, CORS origins.
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_admission_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
    # Frontend configuration: the backend URL the browser should call.
    env_file:
      - ./frontend/.env

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test-runner
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # The suite needs a stable hold duration; the in-process test host
      # overrides it again (ExpiryTestApiFactory uses 2s).
      HOLD_DURATION_SECONDS: "600"
      SEED_DEMO_DATA: "false"
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  db-data:
    name: school_admission_db_data
